name: Python CI

on:
  push:
  pull_request:

jobs:
  evolife-pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Run evolife tests
        run: pytest -q
