# Combined EvoLife PPO config for scenes that spawn both roles.
# Behavior names MUST match Unity Behavior Parameters:
#   EvoLifeHerbivore
#   EvoLifePredator
# Observation size: 28  |  Actions: 2 continuous (move_x, move_z)
# Starter values only — not claimed optima.
behaviors:
  EvoLifeHerbivore:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 50000
    max_steps: 1000000
    time_horizon: 64
    summary_freq: 10000
    threaded: false
  EvoLifePredator:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 50000
    max_steps: 1000000
    time_horizon: 64
    summary_freq: 10000
    threaded: false
