# Lightweight combined curriculum trainer.
# Include this YAML only when the Unity scene has LearnedPpo agents for BOTH roles.
# A scripted role will never connect; the trainer would wait forever for that behavior.
# Observation: CreatureObservationSchema v2 size 31
# Actions: 3 continuous (forward, turn, sprint_or_effort)
#        + 1 discrete branch of size 6 (none, eat, drink, attack, rest, reproduce_request)
# Behavior names MUST match MlAgentsBehaviorNames.
behaviors:
  EvoLifeHerbivore:
    trainer_type: ppo
    hyperparameters:
      batch_size: 512
      buffer_size: 5120
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 25000
    max_steps: 200000
    time_horizon: 64
    summary_freq: 5000
    threaded: false
  EvoLifePredator:
    trainer_type: ppo
    hyperparameters:
      batch_size: 512
      buffer_size: 5120
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 25000
    max_steps: 200000
    time_horizon: 64
    summary_freq: 5000
    threaded: false
